<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1b1f3b"/><stop offset="1" stop-color="#0b0b12"/></linearGradient>
    <linearGradient id="ap" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffb35c"/><stop offset=".5" stop-color="#ff5f8f"/><stop offset="1" stop-color="#7b6cff"/></linearGradient>
    <linearGradient id="lens" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#5ad1ff"/><stop offset="1" stop-color="#3a64ff"/></linearGradient>
  </defs>
  <rect width="512" height="512" fill="url(#bg)"/>
  <g transform="translate(256 256)">
    <!-- khẩu độ -->
    <circle r="150" fill="none" stroke="url(#ap)" stroke-width="34"/>
    <g fill="url(#ap)" opacity=".95">
      <path d="M0-118 L42-58 L-30-44 Z" transform="rotate(0)"/>
      <path d="M0-118 L42-58 L-30-44 Z" transform="rotate(60)"/>
      <path d="M0-118 L42-58 L-30-44 Z" transform="rotate(120)"/>
      <path d="M0-118 L42-58 L-30-44 Z" transform="rotate(180)"/>
      <path d="M0-118 L42-58 L-30-44 Z" transform="rotate(240)"/>
      <path d="M0-118 L42-58 L-30-44 Z" transform="rotate(300)"/>
    </g>
    <circle r="46" fill="url(#lens)"/>
    <circle r="16" cx="-14" cy="-16" fill="#fff" opacity=".55"/>
  </g>
  <!-- thanh trượt -->
  <g stroke-linecap="round">
    <line x1="96" y1="448" x2="416" y2="448" stroke="#ffffff" stroke-opacity=".25" stroke-width="12"/>
    <line x1="96" y1="448" x2="300" y2="448" stroke="#ffb35c" stroke-width="12"/>
    <circle cx="300" cy="448" r="17" fill="#fff"/>
  </g>
</svg>
